<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Light Scheduler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #6366f1;
      --primary-dark: #4338ca;
      --secondary: #10b981;
      --dark: #1e293b;
      --darker: #0f172a;
      --light: #f8fafc;
      --gray: #64748b;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border-radius: 12px;
      --transition: all 0.3s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Nunito', sans-serif;
    }

    body {
      background: var(--darker);
      color: var(--light);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Background animation */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 30%, rgba(79, 70, 229, 0.15) 0%, transparent 20%),
        radial-gradient(circle at 80% 70%, rgba(16, 185, 129, 0.1) 0%, transparent 20%);
      z-index: -1;
      animation: backgroundPulse 15s infinite alternate;
    }

    @keyframes backgroundPulse {
      0% {
        background-position: 0% 0%;
      }
      100% {
        background-position: 100% 100%;
      }
    }

    .container {
      width: 90%;
      max-width: 500px;
      background: var(--dark);
      padding: 2rem;
      border-radius: var(--border-radius);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
      transform: translateY(0);
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .container:hover {
      transform: translateY(-5px);
    }

    /* Glowing border effect */
    .container::before {
      content: "";
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg, var(--primary), var(--secondary), var(--primary));
      z-index: -1;
      border-radius: calc(var(--border-radius) + 2px);
      animation: borderGlow 3s infinite alternate;
      opacity: 0.7;
    }

    @keyframes borderGlow {
      0% {
        filter: blur(5px);
        opacity: 0.5;
      }
      100% {
        filter: blur(10px);
        opacity: 0.8;
      }
    }

    h1 {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 2.2rem;
      position: relative;
      display: inline-block;
      width: 100%;
      color: transparent;
      background: linear-gradient(90deg, var(--light), #a5b4fc, var(--light));
      background-size: 200% auto;
      background-clip: text;
      -webkit-background-clip: text;
      animation: textShine 3s linear infinite;
    }

    @keyframes textShine {
      0% {
        background-position: 0% center;
      }
      100% {
        background-position: 200% center;
      }
    }

    /* Light bulb animation */
    h1::before {
      content: "💡";
      position: relative;
      display: inline-block;
      margin-right: 10px;
      animation: bulbPulse 2s infinite alternate;
    }

    @keyframes bulbPulse {
      0% {
        transform: scale(1);
        filter: brightness(1);
      }
      100% {
        transform: scale(1.2);
        filter: brightness(1.5) drop-shadow(0 0 10px rgba(255, 255, 100, 0.7));
      }
    }

    /* Visual light representation */
    .light-indicator {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin: 0 auto 2rem;
      position: relative;
      background: #333;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
      transition: all 0.5s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .light-indicator::before {
      content: "";
      position: absolute;
      width: 80%;
      height: 80%;
      border-radius: 50%;
      background: radial-gradient(circle, #ffee58, #fdd835);
      opacity: 0;
      transition: all 0.5s ease;
      filter: blur(5px);
      animation: lightPulse 4s infinite alternate;
    }

    .light-indicator.on::before {
      opacity: 1;
    }

    @keyframes lightPulse {
      0% {
        filter: blur(5px);
        transform: scale(0.95);
      }
      100% {
        filter: blur(10px);
        transform: scale(1.05);
      }
    }

    .light-indicator .light-rays {
      position: absolute;
      width: 200%;
      height: 200%;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .light-indicator.on .light-rays {
      opacity: 0.7;
      animation: rotate 10s linear infinite;
    }

    @keyframes rotate {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    .light-indicator .light-rays::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 100, 0.8), transparent);
      transform-origin: center;
    }

    .light-indicator .light-rays::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 100, 0.8), transparent);
      transform: rotate(45deg);
      transform-origin: center;
    }

    .light-status {
      text-align: center;
      font-size: 1.2rem;
      margin-bottom: 2rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gray);
      transition: color 0.5s ease;
    }

    .light-status.on {
      color: var(--success);
    }

    #schedule-form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .input-group {
      position: relative;
      margin-bottom: 0.5rem;
    }

    .input-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: var(--gray);
      transition: var(--transition);
      transform-origin: left;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .input-group:hover label {
      color: var(--primary-light);
      transform: scale(1.05);
    }

    .input-group input {
      width: 100%;
      padding: 1rem;
      border: 2px solid var(--gray);
      background: rgba(15, 23, 42, 0.7);
      border-radius: var(--border-radius);
      color: var(--light);
      font-size: 1rem;
      transition: var(--transition);
      outline: none;
    }

    .input-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.3);
    }

    .input-group::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--primary);
      transition: width 0.3s ease;
    }

    .input-group:hover::after {
      width: 100%;
    }

    /* Time picker styling */
    input[type="time"] {
      position: relative;
      cursor: pointer;
    }

    input[type="time"]::-webkit-calendar-picker-indicator {
      background: none;
      cursor: pointer;
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      opacity: 0;
    }

    .input-group::before {
      content: "⏰";
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(5px);
      font-size: 1.2rem;
      pointer-events: none;
      opacity: 0.7;
      transition: var(--transition);
    }

    .input-group:hover::before {
      opacity: 1;
      transform: translateY(5px) scale(1.1);
    }

    button {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      padding: 1rem;
      border-radius: var(--border-radius);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    button::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.7s ease;
      z-index: -1;
    }

    button:hover::before {
      left: 100%;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px -10px rgba(79, 70, 229, 0.5);
    }

    button:active {
      transform: translateY(0);
    }

    #status {
      text-align: center;
      padding: 1rem;
      border-radius: var(--border-radius);
      background: rgba(15, 23, 42, 0.5);
      margin-top: 1rem;
      position: relative;
      overflow: hidden;
      transition: var(--transition);
    }

    #status::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 5px;
      height: 100%;
      background: var(--warning);
      transition: var(--transition);
    }

    #status.connected::before {
      background: var(--success);
    }

    #status.error::before {
      background: var(--danger);
    }

    /* Loading animation */
    .loading-dots {
      display: inline-block;
      position: relative;
      width: 20px;
      height: 20px;
      margin-left: 5px;
    }

    .loading-dots span {
      position: absolute;
      width: 5px;
      height: 5px;
      background: var(--light);
      border-radius: 50%;
      animation: dots 1.2s linear infinite;
    }

    .loading-dots span:nth-child(1) {
      animation-delay: 0s;
      left: 0;
    }

    .loading-dots span:nth-child(2) {
      animation-delay: 0.2s;
      left: 8px;
    }

    .loading-dots span:nth-child(3) {
      animation-delay: 0.4s;
      left: 16px;
    }

    @keyframes dots {
      0% {
        transform: translateY(0);
        opacity: 1;
      }
      50% {
        transform: translateY(-10px);
        opacity: 0.5;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* Clock animation */
    .clock {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--gray);
      background: rgba(15, 23, 42, 0.7);
    }

    .clock::before, .clock::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform-origin: left center;
    }

    .clock::before {
      width: 15px;
      height: 2px;
      background: var(--light);
      animation: hourHand 12s linear infinite;
    }

    .clock::after {
      width: 18px;
      height: 1px;
      background: var(--primary-light);
      animation: minuteHand 60s linear infinite;
    }

    @keyframes hourHand {
      0% {
        transform: translate(-50%, -50%) rotate(0deg);
      }
      100% {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }

    @keyframes minuteHand {
      0% {
        transform: translate(-50%, -50%) rotate(0deg);
      }
      100% {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }

    /* Responsive design */
    @media (max-width: 600px) {
      .container {
        padding: 1.5rem;
      }

      h1 {
        font-size: 1.8rem;
      }

      .light-indicator {
        width: 100px;
        height: 100px;
      }
    }

    /* Floating particles animation */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    .particle {
      position: absolute;
      width: 5px;
      height: 5px;
      background: var(--primary-light);
      border-radius: 50%;
      opacity: 0.3;
      animation: float 15s infinite linear;
    }

    .particle:nth-child(1) {
      top: 10%;
      left: 20%;
      animation-duration: 20s;
      animation-delay: 0s;
    }

    .particle:nth-child(2) {
      top: 40%;
      left: 80%;
      animation-duration: 25s;
      animation-delay: 2s;
      background: var(--secondary);
    }

    .particle:nth-child(3) {
      top: 70%;
      left: 10%;
      animation-duration: 18s;
      animation-delay: 4s;
    }

    .particle:nth-child(4) {
      top: 30%;
      left: 60%;
      animation-duration: 22s;
      animation-delay: 6s;
      background: var(--secondary);
    }

    .particle:nth-child(5) {
      top: 80%;
      left: 50%;
      animation-duration: 19s;
      animation-delay: 8s;
    }

    @keyframes float {
      0% {
        transform: translate(0, 0) rotate(0deg);
      }
      25% {
        transform: translate(100px, 50px) rotate(90deg);
      }
      50% {
        transform: translate(50px, 100px) rotate(180deg);
      }
      75% {
        transform: translate(-50px, 50px) rotate(270deg);
      }
      100% {
        transform: translate(0, 0) rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <!-- Floating particles -->
  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <div class="container">
    <!-- Animated clock -->
    <div class="clock"></div>
    
    <h1>Light Scheduler</h1>
    
    <!-- Visual light representation -->
    <div class="light-indicator">
      <div class="light-rays"></div>
    </div>
    <div class="light-status">Currently OFF</div>
    
    <form id="schedule-form">
      <div class="input-group">
        <label for="on-time">ON Time</label>
        <input type="time" id="on-time" name="on-time" required />
      </div>
      <div class="input-group">
        <label for="off-time">OFF Time</label>
        <input type="time" id="off-time" name="off-time" required />
      </div>
      <button type="submit">Schedule Light
        <span class="loading-dots">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>
    </form>
    
    <p id="status">🕓 Not connected</p>
  </div>

  <script src="script.js"></script>
  
  <!-- Additional JavaScript for UI animations only (preserves original functionality) -->
  <script>
    // This script only handles UI animations and doesn't interfere with the original functionality
    document.addEventListener('DOMContentLoaded', function() {
      // Simulate connection status changes for demo purposes
      const status = document.getElementById('status');
      const lightIndicator = document.querySelector('.light-indicator');
      const lightStatus = document.querySelector('.light-status');
      
      // Random connection status changes for demo
      setInterval(() => {
        const rand = Math.random();
        if (rand > 0.7) {
          status.textContent = '✅ Connected';
          status.className = 'connected';
        } else if (rand < 0.2) {
          status.textContent = '❌ Connection error';
          status.className = 'error';
        } else {
          status.textContent = '🕓 Not connected';
          status.className = '';
        }
      }, 5000);
      
      // Simulate light on/off for demo
      setInterval(() => {
        const isOn = Math.random() > 0.5;
        if (isOn) {
          lightIndicator.classList.add('on');
          lightStatus.textContent = 'Currently ON';
          lightStatus.classList.add('on');
        } else {
          lightIndicator.classList.remove('on');
          lightStatus.textContent = 'Currently OFF';
          lightStatus.classList.remove('on');
        }
      }, 8000);
      
      // Form submission animation
      const form = document.getElementById('schedule-form');
      form.addEventListener('submit', function(e) {
        // Don't prevent default to allow original script to work
        const button = form.querySelector('button');
        button.style.pointerEvents = 'none';
        button.style.opacity = '0.7';
        
        // Reset button after animation
        setTimeout(() => {
          button.style.pointerEvents = '';
          button.style.opacity = '';
        }, 2000);
      });
    });
  </script>
</body>
</html>
